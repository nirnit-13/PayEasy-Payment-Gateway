# ==========================================
# PayEasy - Application Configuration Template
# ==========================================
# INSTRUCTIONS:
# 1. Copy this file to application.properties
# 2. Replace YOUR_MYSQL_PASSWORD with your actual MySQL password
# 3. DO NOT commit application.properties to GitHub
# ==========================================

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Nirnit@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param

# Logging Configuration
logging.level.root=INFO
logging.level.com.paymentgateway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=INFO

# Jackson JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null