version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: payeasy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payeasy_user
      MYSQL_PASSWORD: payeasy_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  backend:
    build:
      context: ./payment-gateway
      dockerfile: Dockerfile
    container_name: payeasy-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: payeasy_user
      DATABASE_PASSWORD: payeasy_pass
      FRONTEND_URL: http://localhost:5500
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:

# ==========================================
# Usage:
# Start: docker-compose up -d
# Stop: docker-compose down
# Logs: docker-compose logs -f backend
# ==========================================