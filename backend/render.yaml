services:
  - type: web
    name: payeasy-backend
    env: java
    region: oregon # Change to your preferred region
    plan: free
    buildCommand: cd payment-gateway && ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar payment-gateway/target/payeasy-backend.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: DATABASE_USERNAME
        sync: false # Set manually in Render dashboard
      - key: DATABASE_PASSWORD
        sync: false # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false # Set manually after Netlify deployment

# Alternative regions: oregon, frankfurt, singapore, ohio
# Free tier limits: 750 hours/month, auto-sleep after 15 min inactivity