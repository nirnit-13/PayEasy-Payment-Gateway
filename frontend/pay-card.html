<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Payment - PayEasy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <link rel="stylesheet" href="assets/css/transaction.css">
    <style>
        .redirect-message {
            max-width: 600px;
            margin: 4rem auto;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .redirect-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .redirect-message h2 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .redirect-message p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        .loader-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin: 2rem 0;
        }
        
        .loader-dots span {
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loader-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        
        .loader-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        
        .btn-manual {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s;
        }
        
        .btn-manual:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="nav-brand">
                <a href="home.html" style="text-decoration: none; color: inherit; cursor: pointer;">
                    <h2>💳 PayEasy</h2>
                </a>
            </div>
            <div class="nav-menu">
                <a href="home.html" class="nav-link">Home</a>
                <a href="history.html" class="nav-link">History</a>
                <a href="cards.html" class="nav-link">Cards</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="redirect-message">
                <div class="redirect-icon">💳</div>
                <h2>Card Payment</h2>
                <p id="redirectText">Checking your saved cards...</p>
                <div class="loader-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <a href="cards.html" class="btn-manual" style="display: none;" id="manualBtn">Go to Cards</a>
            </div>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        const userData = JSON.parse(sessionStorage.getItem('userData') || '{}');
        
        if (!userData.userId) {
            window.location.href = 'login.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = 'index.html';
        });

        async function checkSavedCards() {
            try {
                // Set payment flow flag
                sessionStorage.setItem('fromPaymentFlow', 'true');
                
                const response = await fetch(`${API_BASE_URL}/cards/user/${userData.userId}`);
                const data = await response.json();
                
                if (data.success && data.cards && data.cards.length > 0) {
                    // User has saved cards, redirect to cards page
                    document.getElementById('redirectText').innerHTML = 
                        `<strong style="color: #28a745;">Found ${data.cards.length} saved card${data.cards.length > 1 ? 's' : ''}!</strong><br>Select a card to make payment.`;
                    
                    setTimeout(() => {
                        window.location.href = 'cards.html';
                    }, 1500);
                } else {
                    // No saved cards, show message
                    sessionStorage.removeItem('fromPaymentFlow');
                    document.getElementById('redirectText').innerHTML = 
                        '<strong style="color: #dc3545;">No saved cards found!</strong><br>Please add a card first to make payments.';
                    document.querySelector('.loader-dots').style.display = 'none';
                    document.getElementById('manualBtn').style.display = 'inline-block';
                    
                    // Auto redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'cards.html';
                    }, 3000);
                }
            } catch (error) {
                console.error('Error checking cards:', error);
                sessionStorage.removeItem('fromPaymentFlow');
                document.getElementById('redirectText').textContent = 
                    'Error loading cards. Redirecting to cards page...';
                setTimeout(() => {
                    window.location.href = 'cards.html';
                }, 2000);
            }
        }

        // Check saved cards on page load
        checkSavedCards();
    </script>
</body>
</html>
