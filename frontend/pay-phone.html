<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay to Phone - PayEasy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <link rel="stylesheet" href="assets/css/transaction.css">
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="nav-brand">
                <a href="home.html" style="text-decoration: none; color: inherit; cursor: pointer;">
                    <h2>💳 PayEasy</h2>
                </a>
            </div>
            <div class="nav-menu">
                <a href="home.html" class="nav-link">Home</a>
                <a href="history.html" class="nav-link">History</a>
                <a href="rewards.html" class="nav-link">Rewards</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <a href="transaction.html" class="back-btn">← Back</a>
                <h3>Pay to Phone Number</h3>
            </div>

            <div class="transaction-container">
                <div class="balance-display">
                    <p>Available Balance</p>
                    <h2 id="availableBalance">₹0.00</h2>
                </div>

                <form id="phonePaymentForm" class="payment-form" autocomplete="off">
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" name="phone-num" maxlength="10" placeholder="9876543210" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="recipientName">Recipient Name</label>
                        <input type="text" id="recipientName" name="recipient-name" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="phone-amount" min="1" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="phone-desc" placeholder="Optional" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="pin">Transaction PIN</label>
                        <input type="password" id="pin" name="txn-pin-phone" maxlength="4" autocomplete="new-password" required>
                    </div>

                    <div id="errorMessage" class="error-message"></div>

                    <div class="swipe-container">
                        <div class="swipe-text">Slide to Pay →</div>
                        <div id="swipeButton" class="swipe-button">📱</div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="assets/js/pay-phone.js"></script>
</body>
</html>
